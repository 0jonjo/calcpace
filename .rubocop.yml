# frozen_string_literal: true

# RuboCop configuration for Calcpace gem
# Following Ruby best practices and style guidelines

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'node_modules/**/*'

# Prefer double quotes for consistency
Style/StringLiterals:
  Enabled: false

# Allow longer lines in tests
Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*'

# Prefer modern hash syntax
Style/HashSyntax:
  EnforcedStyle: ruby19

# Documentation is important for public APIs
Style/Documentation:
  Enabled: true
  Exclude:
    - 'test/**/*'

# Prefer explicit return in some cases for clarity
Style/RedundantReturn:
  Enabled: false

# Allow compact module/class definitions
Style/ClassAndModuleChildren:
  Enabled: false

# Metrics
Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'test/**/*'

Metrics/AbcSize:
  Max: 20
  Exclude:
    - 'test/**/*'

# Keyword arguments are self-documenting, so the ceiling is a little higher than
# the default 5 — but it stays a ceiling: kwargs still count, so a method growing
# to eight or ten of them is flagged.
Metrics/ParameterLists:
  Max: 6

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - '*.gemspec'

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'lib/calcpace/race_splits.rb'
    - 'lib/calcpace/track_calculator.rb'
    # Training zones now cover paces, heart-rate bands and time in those bands.
    # Splitting them would put hr_zones and time_in_zones in different files,
    # which is worse than a long module: one produces exactly what the other reads.
    - 'lib/calcpace/training_zones.rb'

# Allow both single and double quotes for strings
Style/StringLiteralsInInterpolation:
  Enabled: false

# Naming
Naming/MethodParameterName:
  MinNameLength: 1
  AllowedNames:
    - _
    - e

# The documented-examples test evaluates snippets scraped from our own README
# and docstrings — that is the entire point of the file, and the cop's required
# comment format cannot be satisfied without it then reporting the disable as
# redundant.
Style/DocumentDynamicEvalDefinition:
  Exclude:
    - 'test/calcpace/test_documented_examples.rb'
