# VO2max percentiles by age and sex (ml/kg/min), treadmill CPX with measured VO2max
#
# Source: Kaminsky LA, Arena R, Myers J. Reference Standards for
# Cardiorespiratory Fitness Measured With Cardiopulmonary Exercise Testing:
# Data From the Fitness Registry and the Importance of Exercise National
# Database (FRIEND). Mayo Clinic Proceedings 2015;90(11):1515-1523.
# doi:10.1016/j.mayocp.2015.07.026 (author manuscript: PMC4919021)
#
# Table 3, "Sex-Specific Percentiles for CRF From Treadmill Exercise Tests With
# Measured VO2max Obtained From FRIEND [...]", rows "Men from FRIEND" and
# "Women from FRIEND". 7,783 apparently healthy US adults (4,611 men, 3,172
# women) free of known cardiovascular disease, VO2max measured by
# cardiopulmonary exercise testing (not predicted).
#
# The same Table 3 also reproduces the Cooper Clinic percentiles as printed in
# ACSM's Guidelines for Exercise Testing and Prescription, 9th ed. (2014),
# pp. 88-93 — the paper's reference 13 and, in its words, "the only widely
# cited reference data in the United States". They are not used here: those
# VO2max values were predicted from Balke treadmill time rather than measured,
# and their spread is much narrower (95th percentile for men aged 20-29: 55.5
# predicted against 66.3 measured).
#
# Each row lists the VO2max at the percentiles in `percentiles`, in order.
# Age bands are keyed by their lower bound and span ten years (20 = 20-29).

meta:
  table_version: "FRIEND 2015 (Kaminsky et al., Mayo Clin Proc 90:1515, Table 3)"
  doi: "10.1016/j.mayocp.2015.07.026"
  units: "ml/kg/min"
  modality: "treadmill, measured VO2max"

percentiles: [5, 10, 25, 50, 75, 90, 95]

